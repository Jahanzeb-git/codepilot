# Builds the SAME image used for Fly (machine/runner/Dockerfile) and publishes it
# to GitHub Container Registry for local/self-hosted use. This is entirely
# additive — it does not touch fly.toml, does not run on Fly, and Fly's own
# deploy path (which builds this same Dockerfile itself via `fly deploy`)
# is completely unaffected by this workflow existing.
name: Publish workspace image

on:
  workflow_run:
    workflows: ["Publish to PyPI"]
    types:
      - completed
  workflow_dispatch: {}

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/codepilot-workspace

jobs:
  build-and-push:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: cloud/machine
          file: cloud/machine/runner/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The PyPI publish runs on a `v*` tag push, so head_branch is the
          # release tag here (e.g. v1.1.11); the server bakes it in and the
          # profile modal compares it against GitHub's releases/latest.
          build-args: |
            CODEPILOT_VERSION=${{ github.event.workflow_run.head_branch || github.ref_name }}
            CODEPILOT_COMMIT=${{ github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
