name: Release CodePilot Workspace

on:
  push:
    tags:
      - 'v*' # Triggers when you push tags like v1.0.1, v1.0.2

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to upload files to GitHub Releases

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
          cache-dependency-path: 'codepilot-box/go.sum'

      - name: Build binaries
        run: |
          cd codepilot-box
          
          # Build for AMD64 (Standard Linux)
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o codepilot-workspace-linux-amd64 .
          
          # Build for ARM64 (M1/M2 Mac Linux VMs, AWS Graviton)
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o codepilot-workspace-linux-arm64 .

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            codepilot-box/codepilot-workspace-linux-amd64
            codepilot-box/codepilot-workspace-linux-arm64
