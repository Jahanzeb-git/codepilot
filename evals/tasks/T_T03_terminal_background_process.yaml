id: T_T03_terminal_background_process
description: "Start a background HTTP server, verify it responds, then stop it"

setup:
  files:
    - path: "server.py"
      content: |
        from http.server import HTTPServer, BaseHTTPRequestHandler

        class Handler(BaseHTTPRequestHandler):
            def do_GET(self):
                self.send_response(200)
                self.end_headers()
                self.wfile.write(b"OK")
            def log_message(self, *args):
                pass  # suppress output

        HTTPServer(("0.0.0.0", 18765), Handler).serve_forever()

prompt: |
  Start server.py in a background terminal session using new_terminal=True.
  Then in the main terminal, use curl to verify http://localhost:18765 returns
  a 200 response. After confirming it works, call task(finish=True).

assertions:
  max_steps: 4
  max_tool_errors: 0
  max_parse_errors: 0
  must_finish_cleanly: true
  verifier: "terminal_verifiers.BackgroundServerVerifier"
  server_port: 18765

use_llm_judge: false
