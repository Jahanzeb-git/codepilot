[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codepilot-ai"
version = "0.2.1"
description = "A code-native agentic framework for building robust AI agents."
readme = "README.md"
authors = [
    {name = "CodePilot Team", email = "author@example.com"}
]
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0",
    "openai>=1.0",
    "anthropic>=0.3",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "rich>=13.0",
    "jinja2>=3.1"
]

[project.urls]
Homepage = "https://github.com/Jahanzeb-git/codepilot"
Repository = "https://github.com/Jahanzeb-git/codepilot"
