[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codepilot-ai"
version = "0.9.27"
description = "A code-native agentic framework for embedding robust agentic runtime into software components."
readme = "README.md"
authors = [
    {name = "Jahanzeb Ahmed", email = "jahanzebahmed.mail@gmail.com"}
]
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0",
    "openai>=1.0",
    "anthropic>=0.3",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "rich>=13.0",
    "jinja2>=3.1",
    "pexpect>=4.8; sys_platform != 'win32'",
    "pywinpty>=2.0; sys_platform == 'win32'",
    "tiktoken>=0.5"
]

[project.optional-dependencies]
db = [
    "sqlalchemy>=2.0",
]

[project.urls]
Homepage = "https://github.com/Jahanzeb-git/codepilot"
Repository = "https://github.com/Jahanzeb-git/codepilot"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["codepilot*"]

[tool.setuptools.package-data]
"*" = ["*.j2", "*.md"]
