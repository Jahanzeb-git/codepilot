[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codepilot-ai"
version = "0.9.39"
description = "An embeddable, code-native agentic framework featuring sandboxed execution, deterministic Git-diff editing, and persistent PTY session management."
readme = "README.md"
authors = [
    {name = "Jahanzeb Ahmed", email = "jahanzebahmed.mail@gmail.com"}
]
license = {text = "MIT"}
keywords = [
    "ai-agents",
    "agentic-systems",
    "autonomous-agents",
    "code-generation",
    "pty-multiplexing",
    "microvm-sandbox",
    "git-diff-parser",
    "llm-orchestration"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0",
    "openai>=1.0",
    "anthropic>=0.3",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "rich>=13.0",
    "jinja2>=3.1",
    "pexpect>=4.8; sys_platform != 'win32'",
    "pywinpty>=2.0; sys_platform == 'win32'",
    "tiktoken>=0.5"
]

[project.optional-dependencies]
db = [
    "sqlalchemy>=2.0",
]
evals = [
    "pyyaml>=6.0",
    "openai>=1.0",
]

[project.urls]
Homepage = "https://github.com/Jahanzeb-git/codepilot"
Repository = "https://github.com/Jahanzeb-git/codepilot"
Documentation = "https://codepilotdev.netlify.app"
"Bug Tracker" = "https://github.com/Jahanzeb-git/codepilot/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["codepilot*"]

[tool.setuptools.package-data]
"*" = ["*.j2", "*.md"]

